[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kvl"
version = "0.1.0"
description = "Deterministic visual-spatial grid and object execution layer for Kinetic-AG"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.11.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.98.0",
    "pytest>=8.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["kvl*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"
